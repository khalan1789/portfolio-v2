services:
   app-dev:
      build:
         context: .
         dockerfile: Dockerfile.dev
      image: portfolio-v2:dev
      ports:
         - "3000:3000"
      environment:
         - WATCHPACK_POLLING=true
      develop:
         watch:
            - action: sync
              path: .
              target: /app
              ignore:
                 - node_modules/
                 - .next/
            - action: rebuild
              path: package.json
