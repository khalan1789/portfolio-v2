name: CI

on:
   pull_request:
      branches: [main]
   push:
      branches: [main]

jobs:
   quality:
      name: Lint, format & tests
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: npm

         - run: npm ci

         - name: Lint
           run: npx eslint .

         - name: Format check
           run: npm run format:check

         - name: Tests
           run: npm run test
